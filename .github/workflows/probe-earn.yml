name: Probe earnings source
on:
  push:
    branches: [claude/project-thread-x5k7xj]
    paths: [.github/workflows/probe-earn.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          J=/tmp/jar
          curl -sS -m 20 -c $J -A "$UA" -o /dev/null -w "fc %{http_code}\n" https://fc.yahoo.com || true
          CRUMB=$(curl -sS -m 20 -b $J -A "$UA" https://query2.finance.yahoo.com/v1/test/getcrumb); echo "crumb [$CRUMB]"
          for s in CRWV NBIS; do
            echo "=== $s quoteSummary"
            curl -sS -m 20 -b $J -A "$UA" "https://query2.finance.yahoo.com/v10/finance/quoteSummary/$s?modules=earningsHistory,earnings,calendarEvents&crumb=$CRUMB" | head -c 2500; echo
          done
          echo "=== quote v7"
          curl -sS -m 20 -b $J -A "$UA" "https://query2.finance.yahoo.com/v7/finance/quote?symbols=CRWV,RGTI&fields=epsCurrentYear,epsTrailingTwelveMonths,earningsTimestamp,earningsTimestampStart&crumb=$CRUMB" | head -c 1500; echo
          echo "=== yahoo calendar visualization"
          curl -sS -m 20 -b $J -A "$UA" -H "Content-Type: application/json" -X POST "https://query1.finance.yahoo.com/v1/finance/visualization?crumb=$CRUMB&lang=en-US&region=US" -d '{"sortType":"ASC","entityIdType":"earnings","sortField":"startdatetime","includeFields":["ticker","companyshortname","startdatetime","startdatetimetype","epsestimate","epsactual","epssurprisepct"],"query":{"operator":"and","operands":[{"operator":"gte","operands":["startdatetime","2026-11-10"]},{"operator":"lt","operands":["startdatetime","2026-11-11"]},{"operator":"or","operands":[{"operator":"eq","operands":["ticker","CRWV"]},{"operator":"eq","operands":["ticker","RGTI"]}]}]},"offset":0,"size":25}' | head -c 2500; echo
          echo "=== stockanalysis"
          curl -sS -m 20 -A "$UA" "https://stockanalysis.com/api/symbol/s/crwv/statistics" | head -c 300; echo
