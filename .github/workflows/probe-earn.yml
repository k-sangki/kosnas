name: Probe earnings source
on:
  push:
    branches: [claude/project-thread-x5k7xj]
    paths: [.github/workflows/probe-earn.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          H=(-H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36" -H "Accept: application/json, text/plain, */*" -H "Origin: https://www.nasdaq.com" -H "Referer: https://www.nasdaq.com/")
          for u in \
            "https://api.nasdaq.com/api/company/CRWV/earnings-surprise" \
            "https://api.nasdaq.com/api/analyst/CRWV/earnings-date" \
            "https://api.nasdaq.com/api/quote/CRWV/eps" \
            "https://api.nasdaq.com/api/company/CRWV/financials?frequency=2" ; do
            echo "=== $u"; curl -sS --compressed -m 30 "${H[@]}" "$u" | head -c 1500; echo; done
          echo "=== cal 11-10"; curl -sS --compressed -m 30 "${H[@]}" "https://api.nasdaq.com/api/calendar/earnings?date=2026-11-10" | python3 -c "import json,sys;b=json.load(sys.stdin);[print(r) for r in b['data']['rows'] if r['symbol'] in ('CRWV','RGTI')]"
          echo "=== yahoo"; curl -sS -m 30 -A "Mozilla/5.0" "https://query1.finance.yahoo.com/v8/finance/chart/CRWV?range=1d" | head -c 300; echo
          curl -sS -m 30 -A "Mozilla/5.0" "https://query2.finance.yahoo.com/v1/finance/search?q=CRWV&newsCount=5&quotesCount=0" | head -c 1500; echo
          echo "=== sec"; curl -sS -m 30 -A "kosnas research bot admin@kosnas.com" "https://efts.sec.gov/LATEST/search-index?q=%22CoreWeave%22&forms=8-K&dateRange=custom&startdt=2026-11-09&enddt=2026-11-11" | head -c 800; echo
          curl -sS -m 30 -A "kosnas research bot admin@kosnas.com" "https://data.sec.gov/submissions/CIK0001769628.json" | python3 -c "import json,sys;b=json.load(sys.stdin);r=b['filings']['recent'];[print(r['form'][i],r['filingDate'][i],r['acceptanceDateTime'][i],r['primaryDocument'][i],r['accessionNumber'][i]) for i in range(8)]"
