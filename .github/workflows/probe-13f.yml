name: probe 13f
on:
  push:
    branches: [claude/project-thread-sr90vp]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for c in 1336528 949509 1649339 2066484 1965009; do
            curl -s -A "KosNas contact@kosnas.com" https://data.sec.gov/submissions/CIK$(printf %010d $c).json -o s.json
            python3 -c "
          import json;d=json.load(open('s.json'));r=d['filings']['recent'];print(d['cik'],d['name'],len(r['form']))
          print([(r['form'][i],r['reportDate'][i],r['filingDate'][i]) for i in range(len(r['form'])) if r['form'][i].startswith('13F')][:6])
          print(sorted(set(r['form']))[:40]); print(list(zip(r['form'],r['filingDate']))[:12])" || true
            sleep 1
          done
          curl -s -A "KosNas contact@kosnas.com" "https://efts.sec.gov/LATEST/search-index?q=%22Pershing%20Square%22&forms=13F-HR&dateRange=custom&startdt=2026-07-01&enddt=2026-11-17" | head -c 3000 || true
          echo
          curl -s -A "KosNas contact@kosnas.com" "https://efts.sec.gov/LATEST/search-index?q=%22Oaktree%20Capital%22&forms=13F-HR&dateRange=custom&startdt=2026-07-01&enddt=2026-11-17" | python3 -c "
          import json,sys;d=json.load(sys.stdin)
          for h in d['hits']['hits'][:15]: s=h['_source'];print(s.get('display_names'),s.get('file_date'),s.get('period_ending'),s.get('form'))" || true
          curl -s -A "KosNas contact@kosnas.com" "https://efts.sec.gov/LATEST/search-index?q=%22Pershing%20Square%22&forms=13F-HR&dateRange=custom&startdt=2026-07-01&enddt=2026-11-17" | python3 -c "
          import json,sys;d=json.load(sys.stdin)
          for h in d['hits']['hits'][:15]: s=h['_source'];print(s.get('display_names'),s.get('file_date'),s.get('period_ending'),s.get('form'))" || true
