name: Probe fear greed vs CNN
on:
  push:
    branches: [claude/project-thread-gq37j8]
    paths: [scripts/probe_fg.py, .github/workflows/probe-fg.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/probe_fg.py
