name: Probe
on:
  push:
    branches: [probe-recent]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in 1 2 3 4 5 6; do
            curl -s -X POST https://api.hyperliquid.xyz/info -H 'content-type: application/json' -d '{"type":"metaAndAssetCtxs","dex":"xyz"}' | python3 -c "
          import json,sys,datetime;m,c=json.load(sys.stdin)
          for u,x in zip(m['universe'],c):
            if u['name'] in ('xyz:KR200','xyz:EWY','KR200','EWY'): print(datetime.datetime.utcnow().isoformat()[:19],u['name'],'mark',x['markPx'],'oracle',x['oraclePx'],'mid',x.get('midPx'),'prev',x['prevDayPx'])"
            sleep 20
          done
