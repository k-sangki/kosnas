name: probe
on: push
jobs:
  p:
    if: github.ref == 'refs/heads/claude/project-thread-enfaij'
    runs-on: ubuntu-latest
    steps:
      - run: |
          for c in 005930 000660; do
            curl -sS -A "Mozilla/5.0" "https://m.stock.naver.com/api/stock/$c/basic" | head -c 3000; echo; echo ---
            curl -sS -A "Mozilla/5.0" "https://polling.finance.naver.com/api/realtime/domestic/stock/$c" | head -c 3000; echo; echo ---
          done
