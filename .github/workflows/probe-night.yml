name: Probe night sources (temp)
on:
  push:
    branches: [claude/project-thread-by6gfk]
    paths: [.github/workflows/probe-night.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Candles
        run: |
          mkdir out && cd out
          H=https://api.hyperliquid.xyz/info
          S=$(( ($(date +%s) - 86400*30) * 1000 ))
          for c in KR200 EWY SP500 XYZ100 SMSN SKHX KRW; do
            curl -sS -X POST $H -H 'content-type: application/json' -d "{\"type\":\"candleSnapshot\",\"req\":{\"coin\":\"xyz:$c\",\"interval\":\"5m\",\"startTime\":$S}}" > $c.json
            echo "$c $(jq length $c.json) $(jq '.[0].t' $c.json)"
          done
          git init -q && git checkout -q -b probe-night-data && git add . && git -c user.name=bot -c user.email=bot@x commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-night-data
