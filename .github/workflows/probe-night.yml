name: Probe night sources (temp)
on:
  push:
    branches: [claude/project-thread-by6gfk]
    paths: [.github/workflows/probe-night.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Candles
        run: |
          H=https://api.hyperliquid.xyz/info
          S=$(( ($(date +%s) - 86400*3) * 1000 ))
          for c in KR200 EWY KRW SP500 XYZ100 SMSN SKHX; do
            echo "== $c"
            curl -sS -X POST $H -H 'content-type: application/json' -d "{\"type\":\"candleSnapshot\",\"req\":{\"coin\":\"xyz:$c\",\"interval\":\"5m\",\"startTime\":$S}}" | jq -c 'map([.t, .c, .v])'
          done
          echo "== fullctx"
          curl -sS -X POST $H -H 'content-type: application/json' -d '{"type":"metaAndAssetCtxs","dex":"xyz"}' | jq -c '[.[0].universe, .[1]] | transpose | map(select(.[0].name|test("KR200|EWY|KRW"))) '
