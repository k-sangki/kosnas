name: Deploy

# main 에 합쳐지면 Cloudflare Workers 로 배포한다.
# 저장소 Settings > Secrets and variables > Actions 에 CLOUDFLARE_API_TOKEN·CLOUDFLARE_ACCOUNT_ID 를 넣기 전에는 건너뛴다.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: "IndexNow 에 모든 주소를 알린다(처음 한 번·주소 구조가 바뀐 뒤)"
        type: boolean
        default: false

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SITE_URL: https://kosnas.com
      NEXT_PUBLIC_ADSENSE_CLIENT: ${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 빌드·배포
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run deploy
      - name: ads.txt 확인
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          want="google.com, pub-2807429912252096, DIRECT, f08c47fec0942fa0"
          # www 는 kosnas.com 으로 308 이동한다(같은 도메인 안 이동이라 애드센스 허용). 따라가서 본다.
          for u in https://kosnas.com/ads.txt https://www.kosnas.com/ads.txt; do
            code=$(curl -sS -L -o body.txt -w '%{http_code} %{content_type} 최종 %{url_effective}' "$u")
            echo "$u -> $code"; cat body.txt
            grep -qxF "$want" body.txt || { echo "::error::$u 내용이 다릅니다"; exit 1; }
          done
      - name: 검색로봇이 가져가는 주소 확인
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          # 네이버 서치어드바이저가 /favicon.ico 400 을 '수집제한'으로 잡았다(2026-10-21~22)
          for p in favicon.ico robots.txt sitemap.xml; do
            code=$(curl -sS -o /dev/null -A "Mozilla/5.0 (compatible; Yeti/1.1; +https://naver.me/spd)" -w '%{http_code}' "https://kosnas.com/$p")
            echo "/$p -> $code"
            [ "$code" = 200 ] || { echo "::error::/$p 응답 $code"; exit 1; }
          done
      - name: IndexNow 알림(네이버·빙)
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          INDEXNOW_ALL: ${{ inputs.indexnow_all && '1' || '' }}
        run: node scripts/indexnow.mjs
