name: Deploy

# main 에 합쳐지면 Cloudflare Workers 로 배포한다.
# 저장소 Settings > Secrets and variables > Actions 에 CLOUDFLARE_API_TOKEN·CLOUDFLARE_ACCOUNT_ID 를 넣기 전에는 건너뛴다.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SITE_URL: https://kosnas.com
      NEXT_PUBLIC_ADSENSE_CLIENT: ${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 빌드·배포
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run deploy
