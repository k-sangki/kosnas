name: Collect KR

# 금융위원회 주식시세정보는 다음 영업일 13시 뒤에 올라온다(금요일분은 월요일 13시). 월~금 13:20부터
# 여러 번(KST 13:20·13:50·14:40·16:10·18:10) 돌아 전날 시세를 받고 섹터 자료(src/data/kr-sectors.json)를
# 다시 계산해, 바뀌었으면 main에 올린 뒤 바로 배포한다. 이미 받았으면 금방 끝난다.
# GitHub 예약 실행은 몇 시간씩 늦게 시작하기도 해서 한 번만 걸지 않는다.
# 날짜별 원본 시세와 업종 표는 data 브랜치(state/)에 쌓는다.
# 필요한 값: DATA_GO_KR_KEY, DART_API_KEY, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
on:
  schedule:
    - cron: "20 4 * * 1-5"
    - cron: "50 4 * * 1-5"
    - cron: "40 5 * * 1-5"
    - cron: "10 7 * * 1-5"
    - cron: "10 9 * * 1-5"
  workflow_dispatch:

concurrency: collect-kr

permissions:
  contents: write
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 쌓아 둔 시세 가져오기
        run: |
          if git ls-remote --exit-code origin data >/dev/null; then
            git fetch --depth 1 origin data
            git worktree add state origin/data
          else
            mkdir state
          fi
      - name: 시세 받기·섹터 계산
        id: collect
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python collector/krx.py --state state --out src/data/kr-sectors.json --stocks public/data/kr-stocks.json
      # 받기가 중간에 실패해도 받은 데까지는 남긴다
      - name: 시세를 data 브랜치에 저장
        if: always()
        run: |
          git config --global user.name "kosnas-bot"
          git config --global user.email "actions@users.noreply.github.com"
          cd state
          [ -e .git ] || git init -q -b data
          git add -A .
          git commit -qm "시세 $(date -u +%F)" || exit 0
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:data
      - name: 섹터 자료를 main에 올리기
        id: publish
        run: |
          git add src/data/kr-sectors.json public/data/kr-stocks.json
          if git diff --cached --quiet; then echo "changed=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -qm "국내 섹터 자료 $(jq -r .asof src/data/kr-sectors.json)"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          echo "changed=1" >> "$GITHUB_OUTPUT"
      # 처음 1년치처럼 한 번에 다 못 받았으면 이어 받기를 한 번 더 건다
      - name: 이어 받기
        if: steps.collect.outputs.more == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect-kr.yml --ref main
      # 위 push는 GITHUB_TOKEN이라 Deploy 워크플로가 따로 돌지 않으므로 여기서 배포한다
      - uses: actions/setup-node@v4
        if: steps.publish.outputs.changed == '1'
        with:
          node-version: 22
          cache: npm
      - name: 배포
        if: steps.publish.outputs.changed == '1' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SITE_URL: https://kosnas.com
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT }}
        run: npm ci && npm run deploy
      - name: IndexNow 알림(네이버·빙)
        if: steps.publish.outputs.changed == '1'
        run: node scripts/indexnow.mjs
