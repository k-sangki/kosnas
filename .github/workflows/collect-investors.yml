name: Collect investors

# 유명 투자자의 최근 30일 지분 공시·내부자 매매 공시와 ARK 매일 보유 내역을 하루 두 번(07:30·20:30 KST) 받는다.
# 바뀐 것이 있을 때만 main에 올려 배포한다.
on:
  schedule:
    - cron: "30 22 * * *"
    - cron: "30 11 * * *"
  workflow_dispatch:
  push:
    branches: [collect-investors-first]

concurrency: collect-investors

permissions:
  contents: write
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 공시·ARK 받기
        run: python collector/investors_recent.py --out src/data/investors.json --ark src/data/ark-holdings.json
      - name: main에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add src/data/investors.json src/data/ark-holdings.json
          git diff --cached --quiet && exit 0
          git config user.name "kosnas-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -qm "유명 투자자 최근 매매 $(jq -r '.updated' src/data/investors.json)"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          # 봇이 올린 커밋은 배포를 깨우지 않으니 직접 부른다
          gh workflow run deploy.yml --ref main
